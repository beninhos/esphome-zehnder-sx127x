# Example: Zehnder fan (RPMe, ComfoAir) on a LILYGO T3 V1.6.1 868 MHz (ESP32 + SX1276).
esphome:
  name: zehnder-fan
  min_version: 2026.8.0

esp32:
  board: ttgo-lora32-v21
  framework:
    type: esp-idf

external_components:
  - source: github://beninhos/esphome-zehnder-sx127x
    components: [zehnder_sx127x]

logger:
  level: INFO   # VERBOSE prints every frame: use it once to find network_id and fan_id

api:
  encryption: {}

ota:
  - platform: esphome

wifi:
  ap: {}

captive_portal:

# LILYGO T3 V1.6.1 pins (utilities.h, T3_V1_6_SX1276)
spi:
  clk_pin: GPIO5
  mosi_pin: GPIO27
  miso_pin: GPIO19

sx127x:
  id: radio
  cs_pin: GPIO18
  rst_pin: GPIO23
  dio0_pin: GPIO26
  frequency: 868400000     # channel 118. Add your board's crystal offset (ours: +20 kHz), see README
  modulation: FSK
  packet_mode: true
  bitsync: true
  bitrate: 100000          # 100 kchip/s = 50 kbit/s after Manchester coding
  deviation: 50kHz
  bandwidth: 125_0kHz
  shaping: GAUSSIAN_BT_0_5
  crc_enable: false        # the nRF905 CRC is done in software
  preamble_polarity: 0x55
  preamble_size: 1         # 0x55 + sync 0x55 0x99 = the nRF905 preamble
  preamble_detect: 0       # preamble too short for the detector: trigger on RSSI
  rx_floor: -95
  sync_value: [0x55, 0x99]
  payload_length: 44
  pa_power: 10             # +10 dBm like the nRF905; stay under 25 mW e.r.p. with your antenna

fan:
  - platform: zehnder_sx127x
    name: Ventilation
    network_id: 0x1A2B3C4D # from the VERBOSE log while pressing your RFZ remote
    id: zehnder
    fan_id: 0x2C           # the fan's ID in that log (tx type 01)
    remote_id: 0x5A        # any unused ID 0x01-0xFE; no pairing needed
    query_interval: 60s
    confirmed:
      id: confirmed
      name: Ventilation confirmed
    signal:
      id: fan_signal
      name: Fan signal
    noise:
      id: rf_noise
      name: RF noise

button:
  - platform: template
    name: Timer 10 min
    on_press:
      - lambda: id(zehnder)->set_timer(10);
  - platform: template
    name: Timer 30 min
    on_press:
      - lambda: id(zehnder)->set_timer(30);

# Optional: status on the board's OLED (SSD1306 128x64), three pages, the next one every 10 s.
sensor:
  - platform: wifi_signal
    id: wifi_dbm
    name: WiFi signal
    update_interval: 10s

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid
    ip_address:
      id: wifi_ip

i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz        # a full redraw then takes ~23 ms; at the default 50 kHz ~180 ms, with the radio deaf

font:
  - file: "gfonts://Roboto"
    id: small
    size: 12
  - file: "gfonts://Roboto"
    id: large
    size: 22

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: never  # redraw only on a page change (interval below)
    pages:
      - id: page_fan
        lambda: |-
          it.print(0, 0, id(small), "Ventilation");
          it.printf(0, 15, id(large), "Speed %d%s", id(zehnder).speed, id(zehnder)->timer_active() ? " (timer)" : "");
          it.print(0, 48, id(small), id(confirmed).state ? "Confirmed" : "No answer");
      - id: page_radio
        lambda: |-
          it.print(0, 0, id(small), "Radio 868.4 MHz");
          float s = id(fan_signal).state, n = id(rf_noise).state;
          if (std::isnan(s)) it.print(0, 16, id(small), "Fan: --");
          else it.printf(0, 16, id(small), "Fan: %.0f dBm", s);
          if (std::isnan(n)) it.print(0, 32, id(small), "Noise: --");
          else it.printf(0, 32, id(small), "Noise: %.0f dBm", n);
          if (!std::isnan(s) && !std::isnan(n)) it.printf(0, 48, id(small), "Margin: %.0f dB", s - n);
      - id: page_wifi
        lambda: |-
          it.print(0, 0, id(small), "WiFi");
          it.print(0, 16, id(small), id(wifi_ssid).state.c_str());
          it.print(0, 32, id(small), id(wifi_ip).state.c_str());
          if (!std::isnan(id(wifi_dbm).state)) it.printf(0, 48, id(small), "%.0f dBm", id(wifi_dbm).state);

interval:
  - interval: 10s
    then:
      - display.page.show_next: oled
      - component.update: oled
